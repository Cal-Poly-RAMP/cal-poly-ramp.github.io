[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carpDocs"
version = "0.0.1"
description = "Documentation for carp"
authors = [
  { name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

# Documentation-specific dependencies
dependencies = [
  "pygments>=2.19.1",
  "docutils>=0.21.2",
  "furo>=2024.8.6",
  "livereload>=2.7.1",
  "myst-parser>=4.0.1",
  "pycodestyle>=2.12.1",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-favicon>=1.0.1",
  "sphinx-tabs>=3.4.7",
  "sphinxcontrib-mermaid>=1.0.0",
  "sphinxcontrib-images>=1.0.1",
]

[dependency-groups]
dev = ["pre-commit>=4.1.0", "ipykernel>=6.29.5", "mypy>=1.15.0"]

[tool.setuptools]
packages = []

[tool.mypy]
exclude = "^.tmp/"
ignore_missing_imports = true

[tool.bandit]
skips = ['B101']

[tool.ruff]

extend-exclude = [
  "__pycache__",
  "docs",
  "site",
  ".eggs",
  ".git",
  ".venv",
  "build",
  "dist",
  "notebooks",
  ".cache",
]
line-length = 120

[tool.ruff.lint]
ignore = [
  "E402",   # Module level import not at top of file
  "E501",   # Line too long
  "E203",   # Whitespace before ':' -> conflicts with black
  "D401",   # First line should be in imperative mood
  "RET504", # Unnecessary variable assignment before return statement
  "RET505", # Unnecessary elif after return statement
  "SIM102", # Use a single if-statement instead of nested if-statements
  "SIM117", # Merge with statements for context managers that have same scope
  "SIM118", # Checks for key-existence checks against dict.keys() calls
]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"] # Unused import

[tool.ruff.lint.isort]
known-first-party = [""]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
pythonpath = [".", "scripts", "src"]
