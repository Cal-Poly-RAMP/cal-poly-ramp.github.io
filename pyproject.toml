[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiwiKoreDocs"
version = "0.0.1"
description = "Documentation for kiwiKore"
authors = [
  { name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

# Documentation-specific dependencies
dependencies = [
  "pygments>=2.19.1",
  "docutils>=0.21.2",
  "furo>=2024.8.6",
  "livereload>=2.7.1",
  "myst-parser>=4.0.1",
  "pycodestyle>=2.12.1",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-favicon>=1.0.1",
  "sphinx-tabs>=3.4.7",
  "sphinxcontrib-mermaid>=1.0.0",
]

[tool.uv.sources]

[tool.uv.workspace]
members = ["shared/*", "src/*"]

[tool.uv]
dev-dependencies = [
  "pre-commit>=3.8.0",
  "ipykernel>=6.29.5",
  "pytest>=8.3.2",
  # These are added as dev dependencies becuase they should be available
  #  when developing the project.
  "deptry>=0.23.0",
  "mypy>=1.15.0",
  "pytest-cov>=6.0.0",
  "types-docutils>=0.21.0.20241128",
  "types-pygments>=2.19.0.20250219",
]

package = false

[tool.black]
line-length = 88
exclude = '''
^/(
  (
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.venv
    | _build
    | build
    | dist
    | .notebooks
    | .nox
  )
)
'''

[tool.isort]
profile = "black"
extend_skip = [".tmp", ".venv"]

[tool.mypy]
exclude = "^.tmp/"
ignore_missing_imports = true

[tool.bandit]
skips = ['B101']

[tool.ruff]
lint.ignore = ["E501"]
extend-exclude = ["__pycache__", "docs", "site", ".tmp"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
pythonpath = [".", "scripts", "src"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "docutils",
  "furo",
  "livereload",
  "myst-parser",
  "pycodestyle",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-favicon",
  "sphinx-tabs",
  "pygments",
  "sphinxcontrib-mermaid",
]
